name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install wsgidav python-multipart fastapi uvicorn

      - name: Run tests
        run: python -m pytest --tb=short -q -p no:timeout

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check syntax
        run: python -m py_compile picard/orchestrator.py picard/crypto.py picard/index.py picard/config.py picard/cli.py picard/web.py picard/mcp_server.py

      - name: Verify imports
        run: python -c "from picard.orchestrator import Orchestrator; from picard.cli import app; print('OK')"
