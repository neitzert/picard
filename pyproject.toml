[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picard"
version = "0.1.0"
description = "Protocol-Introspecting Chunk Adapter for Resilient Data — encrypt, chunk, and scatter data across protocol gaps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Christopher Neitzert", email = "chris@neitzert.com" }]
dependencies = [
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "typer>=0.12",
]

[project.optional-dependencies]
bluesky = ["atproto>=0.0.55"]
reddit = ["praw>=7.7"]
dns = ["dnspython>=2.6"]
cloudflare = ["httpx>=0.27"]
mqtt = ["paho-mqtt>=2.0"]
mastodon = ["Mastodon.py>=1.8"]
discord = ["httpx>=0.27"]
telegram = ["httpx>=0.27"]
matrix = ["httpx>=0.27"]
slack = ["httpx>=0.27"]
nostr = ["websockets>=12.0"]
github = ["httpx>=0.27"]
gitlab = ["httpx>=0.27"]
xmpp = ["slixmpp>=1.8"]
http-headers = ["httpx>=0.27"]
amqp = ["aio-pika>=9.0"]
websocket = ["websockets>=12.0"]
grpc = ["httpx>=0.27"]
ipfs = ["httpx>=0.27"]
s3 = ["boto3>=1.34"]
redis = ["redis>=5.0"]
etcd = ["httpx>=0.27"]
consul = ["httpx>=0.27"]
couchdb = ["httpx>=0.27"]
postgresql = ["asyncpg>=0.29"]
dynamodb = ["boto3>=1.34"]
caldav = ["httpx>=0.27"]
carddav = ["httpx>=0.27"]
webdav = ["httpx>=0.27"]
qr = ["qrcode>=7.4", "Pillow>=10.0"]
ethereum = ["httpx>=0.27"]
fuse = ["refuse>=0.0.3"]
sqlite = ["aiosqlite>=0.20"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]

[project.scripts]
picard = "picard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["picard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
