[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picard-store"
version = "0.3.1"
description = "Protocol-Introspecting Chunk Adapter for Resilient Data: encrypt, chunk, and scatter data across protocol gaps."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Christopher Neitzert" }]
keywords = ["encryption", "scatter", "storage", "adapters", "privacy", "security", "chunks", "aes-256-gcm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "typer>=0.12",
    "rich>=13.0",
    "aiohttp>=3.13.4",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/neitzert/picard"
Repository = "https://github.com/neitzert/picard"
Documentation = "https://github.com/neitzert/picard/tree/main/docs"
Changelog = "https://github.com/neitzert/picard/blob/main/CHANGELOG.md"
Issues = "https://github.com/neitzert/picard/issues"

[project.optional-dependencies]
bluesky = ["atproto>=0.0.55"]
reddit = ["praw>=7.7"]
dns = ["dnspython>=2.6"]
cloudflare = ["httpx>=0.27"]
mqtt = ["paho-mqtt>=2.0"]
mastodon = ["Mastodon.py>=1.8"]
discord = ["httpx>=0.27"]
telegram = ["httpx>=0.27"]
matrix = ["httpx>=0.27"]
slack = ["httpx>=0.27"]
nostr = ["websockets>=12.0"]
github = ["httpx>=0.27"]
gitlab = ["httpx>=0.27"]
xmpp = ["slixmpp>=1.8"]
http-headers = ["httpx>=0.27"]
amqp = ["aio-pika>=9.0"]
websocket = ["websockets>=12.0"]
grpc = ["httpx>=0.27"]
ipfs = ["httpx>=0.27"]
s3 = ["boto3>=1.34"]
redis = ["redis>=5.0"]
etcd = ["httpx>=0.27"]
consul = ["httpx>=0.27"]
couchdb = ["httpx>=0.27"]
postgresql = ["asyncpg>=0.29"]
dynamodb = ["boto3>=1.34"]
caldav = ["httpx>=0.27"]
carddav = ["httpx>=0.27"]
webdav = ["httpx>=0.27"]
qr = ["qrcode>=7.4", "Pillow>=10.0"]
ethereum = ["httpx>=0.27", "eth-account>=0.13.0"]
polygon = ["eth-account>=0.13.0"]
stellar = ["stellar-sdk>=11.0"]
tezos = []
cardano = ["pycardano>=0.9.0"]
fuse = ["refuse>=0.0.3"]
webdav-server = ["wsgidav>=4.0", "cheroot>=10.0"]
mcp = ["mcp>=1.0"]
tor = ["stem>=1.8", "httpx-socks[asyncio]>=0.9"]
sqlite = ["aiosqlite>=0.20"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
browser = ["playwright>=1.40"]
rowhammer = []
halfdouble = []
throwhammer = ["pyverbs>=41.0"]
cpu-cache = []
mempool = ["web3>=6.0"]
icmp-inflight = ["scapy>=2.5"]
proc-mem = []
latency = []
thermal = []
hdd-smart = []
sip-registrar = []
sip-presence = []
turn = []
rtp-inflight = []
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]

[project.scripts]
picard = "picard.cli:app"
picard-mcp = "picard.mcp_server:run"

[tool.hatch.build.targets.wheel]
packages = ["picard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
markers = [
    "integration: marks tests as integration tests that hit real services",
    "browser: marks tests that require a Playwright browser",
    "slow: marks tests as slow (large data; skipped by default — run with -m slow)",
    "timeout: per-test timeout override (used by pytest-timeout plugin)",
]
