[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picard"
version = "0.1.0"
description = "Protocol-Introspecting Chunk Adapter for Resilient Data — encrypt, chunk, and scatter data across protocol gaps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Christopher Neitzert", email = "chris@neitzert.com" }]
dependencies = [
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "typer>=0.12",
]

[project.optional-dependencies]
bluesky = ["atproto>=0.0.55"]
reddit = ["praw>=7.7"]
dns = ["dnspython>=2.6"]
cloudflare = ["httpx>=0.27"]
mqtt = ["paho-mqtt>=2.0"]
mastodon = ["Mastodon.py>=1.8"]
discord = ["httpx>=0.27"]
telegram = ["httpx>=0.27"]
matrix = ["httpx>=0.27"]
slack = ["httpx>=0.27"]
nostr = ["websockets>=12.0"]
github = ["httpx>=0.27"]
gitlab = ["httpx>=0.27"]
xmpp = ["slixmpp>=1.8"]
fuse = ["refuse>=0.0.3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
picard = "picard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["picard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
